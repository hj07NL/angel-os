name: Maandelijkse websitecontrole

on:
  schedule:
    - cron: '17 3 1 * *'   # elke 1e van de maand om 03:17 UTC
  workflow_dispatch: {}      # handmatig: Actions → Maandelijkse websitecontrole → Run workflow

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Websites controleren
        run: node tools/health-check.mjs
      - name: Rapport opslaan
        run: |
          git config user.name "angel-os-websitecontrole"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Websitecontrole $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
